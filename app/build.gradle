plugins {
    id 'com.android.application'
}

def releaseKeystorePath = providers.environmentVariable('AUDIOSHARE_KEYSTORE_PATH').orNull
def releaseKeystorePassword = providers.environmentVariable('AUDIOSHARE_KEYSTORE_PASSWORD').orNull
def releaseKeyAlias = providers.environmentVariable('AUDIOSHARE_KEY_ALIAS').orNull
def releaseKeyPassword = providers.environmentVariable('AUDIOSHARE_KEY_PASSWORD').orNull
def releaseSigningInputs = [
        AUDIOSHARE_KEYSTORE_PATH: releaseKeystorePath,
        AUDIOSHARE_KEYSTORE_PASSWORD: releaseKeystorePassword,
        AUDIOSHARE_KEY_ALIAS: releaseKeyAlias,
        AUDIOSHARE_KEY_PASSWORD: releaseKeyPassword,
]
def suppliedSigningInputs = releaseSigningInputs.findAll {
    _, value -> value != null && !value.isBlank()
}
if (!suppliedSigningInputs.isEmpty() &&
        suppliedSigningInputs.size() != releaseSigningInputs.size()) {
    def missingNames = releaseSigningInputs.findAll {
        _, value -> value == null || value.isBlank()
    }.keySet().join(', ')
    throw new GradleException("Incomplete release signing configuration; missing: $missingNames")
}
def hasExternalSigning = suppliedSigningInputs.size() == releaseSigningInputs.size()
if (hasExternalSigning && !file(releaseKeystorePath).isFile()) {
    throw new GradleException('AUDIOSHARE_KEYSTORE_PATH does not identify a readable file')
}

android {
    namespace = 'com.audioshare.usbcompanion'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.audioshare.usbcompanion'
        minSdk = 26
        targetSdk = 36
        versionCode = 4
        versionName = '1.0.0-rc.1'

        testInstrumentationRunner = 'android.app.Instrumentation'
    }

    signingConfigs {
        if (hasExternalSigning) {
            create('releaseExternal') {
                storeFile = file(releaseKeystorePath)
                storePassword = releaseKeystorePassword
                keyAlias = releaseKeyAlias
                keyPassword = releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasExternalSigning) {
                signingConfig = signingConfigs.getByName('releaseExternal')
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.register('verifyReleaseSigningInputs') {
    doLast {
        if (!hasExternalSigning) {
            throw new GradleException(
                    'Release builds require the four AUDIOSHARE_KEY* signing inputs. ' +
                    'Use assembleDebug for a local POC build.')
        }
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn 'verifyReleaseSigningInputs'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
