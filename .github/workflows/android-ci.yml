name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up and validate Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Install pinned Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Validate device smoke-test script
        run: python3 -m py_compile tools/device_protocol_smoke.py

      - name: Test, lint, and assemble
        run: ./gradlew clean testDebugUnitTest lintRelease assembleDebug assembleRelease --no-daemon --max-workers=1
